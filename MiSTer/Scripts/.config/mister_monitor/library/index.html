<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca · MiSTer Monitor</title>
<style>
:root{color-scheme:dark;--bg:#0c111a;--panel:#141d2a;--line:#283445;--text:#edf3fa;--muted:#a0afc0;--mint:#9be7b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;min-height:48px;padding:10px 20px}button:hover,button:focus-visible{border-color:var(--mint)}button:disabled{opacity:.35;cursor:default}header{display:flex;align-items:center;justify-content:space-between;padding:26px 4vw;border-bottom:1px solid var(--line);gap:20px}.brand{font-size:13px;letter-spacing:.16em;color:var(--mint)}h1{font-size:32px;margin:7px 0 0;letter-spacing:-.04em}.connection{font-size:13px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;background:var(--mint);border-radius:50%;margin-right:7px}main{padding:26px 4vw;max-width:1600px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:200px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 18px}.active{background:var(--mint);color:#10251a}.meta{margin:24px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}.breadcrumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}.card{padding:0;overflow:hidden;text-align:left;border-radius:16px;position:relative}.art{height:235px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#213c45,#19232f);padding:15px}.art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 12px #0005)}.placeholder{font-size:50px;color:var(--mint);opacity:.8}.caption{padding:15px}.title{font-size:15px;font-weight:650;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:40px}.system{font-size:12px;color:var(--muted);margin-top:10px}.star{position:absolute;top:10px;right:10px;background:#0c111ad9;border:1px solid var(--line);border-radius:9px;padding:5px 9px;color:var(--mint)}.empty{grid-column:1/-1;padding:65px 20px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:center;align-items:center;gap:18px;margin:25px 0}#status{color:var(--muted);min-height:24px;font-size:14px;line-height:1.6}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;width:min(500px,90vw)}dialog::backdrop{background:#05080dd9;backdrop-filter:blur(5px)}dialog h2{font-size:25px;margin:0 0 12px}dialog p{color:var(--muted);line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.primary{background:var(--mint);color:#10251a}.note{font-size:12px;color:var(--muted)}@media(max-width:1100px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}.art{height:210px}}@media(max-width:650px){header{padding:20px}h1{font-size:26px}.connection{display:none}main{padding:20px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:185px}.toolbar button{padding:10px 14px}}
</style></head><body>
<header><div><div class="brand">MISTER MONITOR / GUITION</div><h1>Sua próxima partida.</h1></div><div class="connection"><span class="dot"></span>Biblioteca do microSD</div></header>
<main><nav class="toolbar" aria-label="Biblioteca"><button id="home">Sistemas</button><button id="favorites">☆ Favoritos</button><button id="up">↑ Voltar</button><input id="search" aria-label="Buscar nesta pasta" placeholder="Buscar nesta pasta…" maxlength="120"><button id="refresh" aria-label="Atualizar biblioteca">Atualizar</button></nav>
<div class="meta"><span class="breadcrumb" id="folder">Carregando biblioteca…</span><span id="total"></span></div><div id="grid" aria-live="polite"></div><footer><button id="prev">← Anterior</button><span id="page"></span><button id="next">Próxima →</button></footer><p id="status" role="status"></p><p class="note">Capas do pacote local. O lançamento troca o jogo atual; confirme antes de continuar.</p></main>
<dialog id="details"><h2 id="game-title"></h2><p id="game-system"></p><p>Iniciar este jogo encerra a partida atual. Progresso não salvo poderá ser perdido.</p><div class="actions"><button id="cancel">Cancelar</button><button id="favorite">☆ Favoritar</button><button id="launch" class="primary">Iniciar jogo →</button></div></dialog>
<script src="/library/app.js" defer></script></body></html>
